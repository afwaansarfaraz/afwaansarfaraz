<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Afwaan Sarfaraz</title>
  <desc id="d">Building AI agents that investigate, explain, and stay under human control. Decorative graph of alert, metric, log and trace signals converging on a single root-cause node.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <radialGradient id="glow" cx="1010" cy="225" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DE2D0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2DE2D0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="1190" cy="30" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2DE2D0" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2DE2D0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="440" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="440" rx="18" fill="url(#violet)"/>
  <rect x="1" y="1" width="1198" height="438" rx="17" fill="none" stroke="#1B2A52" stroke-width="2"/>

  <!-- Signal graph: outer signals -> mid correlations -> one root cause -->
  <g stroke-width="1.6" fill="none" stroke="#8B5CF6" stroke-opacity="0.45">
    <path d="M760 95 L905 150"/>
    <path d="M740 215 L905 150"/>
    <path d="M740 215 L920 300"/>
    <path d="M770 345 L920 300"/>
    <path d="M880 60 L905 150"/>
    <path d="M880 395 L920 300"/>
    <path d="M1010 50 L1100 150"/>
    <path d="M1150 60 L1100 150"/>
    <path d="M1160 225 L1110 305"/>
    <path d="M1000 400 L1110 305"/>
    <path d="M880 60 L1100 150" stroke-opacity="0.22"/>
    <path d="M920 300 L1110 305" stroke-opacity="0.22"/>
  </g>
  <g stroke-width="2.4" fill="none" stroke="#2DE2D0" stroke-opacity="0.85">
    <path d="M905 150 L1010 225"/>
    <path d="M920 300 L1010 225"/>
    <path d="M1100 150 L1010 225"/>
    <path d="M1110 305 L1010 225"/>
  </g>

  <g fill="#0B1226" stroke="#8B5CF6" stroke-width="2">
    <circle cx="760" cy="95" r="6"/>
    <circle cx="740" cy="215" r="6"/>
    <circle cx="770" cy="345" r="6"/>
    <circle cx="880" cy="60" r="6"/>
    <circle cx="880" cy="395" r="6"/>
    <circle cx="1010" cy="50" r="6"/>
    <circle cx="1000" cy="400" r="6"/>
    <circle cx="1150" cy="60" r="6"/>
    <circle cx="1160" cy="225" r="6"/>
  </g>
  <g fill="#0B1226" stroke="#2DE2D0" stroke-width="2.4">
    <circle cx="905" cy="150" r="10"/>
    <circle cx="920" cy="300" r="10"/>
    <circle cx="1100" cy="150" r="10"/>
    <circle cx="1110" cy="305" r="10"/>
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" fill="#7C8DB5">
    <text x="772" y="90">alert</text>
    <text x="690" y="244">metric</text>
    <text x="782" y="372">log</text>
    <text x="892" y="56">trace</text>
  </g>

  <!-- Root cause -->
  <circle cx="1010" cy="225" r="46" fill="none" stroke="#2DE2D0" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="1010" cy="225" r="30" fill="none" stroke="#2DE2D0" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="1010" cy="225" r="30" fill="none" stroke="#2DE2D0" stroke-width="2">
    <animate attributeName="r" values="30;66" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.55;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="225" r="16" fill="#2DE2D0"/>
  <circle cx="1010" cy="225" r="6" fill="#05070F"/>
  <text x="1010" y="288" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="17" fill="#2DE2D0">root cause</text>

  <!-- Copy -->
  <text x="70" y="86" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="20" fill="#2DE2D0" fill-opacity="0.85">afwaan@lab:~$ investigate --root-cause</text>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" fill="#E6F1FF">
    <text x="66" y="206" font-size="92" letter-spacing="-2">Afwaan</text>
    <text x="66" y="296" font-size="92" letter-spacing="-2">Sarfaraz</text>
  </g>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="29" fill="#9FB3D9">
    <text x="70" y="348">Building AI agents that investigate,</text>
    <text x="70" y="384">explain, and stay under human control.</text>
  </g>
</svg>
